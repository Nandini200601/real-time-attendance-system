<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="css/style.css">
<div class="header">

<img src="logo.png" class="logo">

<h1>MGIT COLLEGE</h1>

<h3>
Real-Time Attendance Tracking and Parent Notification System
</h3>

</div>

<div class="navbar">

<a href="dashboard.html">Dashboard</a>

</div>

<title>Attendance System</title>
</head>

<body>


<h2>Real-Time Attendance Tracking System</h2>

<label>Subject:</label>
<input type="text" id="subject">

<br><br>

<label>Faculty:</label>
<input type="text" id="faculty">

<br><br>

<label>Period:</label>
<input type="number" id="period">

<br><br>

<table border="1" id="studentTable">

<tr>
<th>Student ID</th>
<th>Student Name</th>
<th>Status</th>
</tr>

</table>

<br>

<button onclick="submitAttendance()">
Submit Attendance
</button>

<script>

fetch('/students')
.then(res => res.json())
.then(data => {

    const table =
    document.getElementById(
    'studentTable'
    );

    data.forEach(student => {

        const row =
        table.insertRow();

        row.innerHTML = `
        <td>${student.student_id}</td>

        <td>${student.student_name}</td>

        <td>
            <select>
                <option>
                Present
                </option>

                <option>
                Absent
                </option>
            </select>
        </td>
        `;
    });
});

async function submitAttendance() {

    const subject =
    document.getElementById(
    'subject'
    ).value;

    const faculty =
    document.getElementById(
    'faculty'
    ).value;

    const period =
    document.getElementById(
    'period'
    ).value;

    const rows =
    document.querySelectorAll(
    '#studentTable tr'
    );

    for(let i=1;i<rows.length;i++){

        const student_id =
        rows[i].cells[0].innerText;

        const status =
        rows[i]
        .querySelector('select')
        .value;

        await fetch(
        '/markAttendance',
        {
            method:'POST',

            headers:{
                'Content-Type':
                'application/json'
            },

            body:JSON.stringify({

                student_id,
                status,
                subject,
                faculty,
                period_no:period
            })
        });
    }

    alert(
    'Attendance Saved & Emails Sent'
    );
}

</script>

</body>
</html>
