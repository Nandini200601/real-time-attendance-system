<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="header">

    <img src="logo.png" class="logo">

    <h1>MGIT COLLEGE</h1>

    <h3>
        Real-Time Attendance Tracking and Parent Notification System
    </h3>

</div>

<div class="navbar">

    <a href="dashboard.html">Dashboard</a>

    <a href="students.html">Students</a>

    <a href="attendance.html">Attendance</a>

    <a href="reports.html">Reports</a>
<a href="percentage.html">Percentage</a>

    <a href="login.html" class="logout">Logout</a>

</div>

<div class="container">

    <h2>Dashboard</h2>

    <p>
        Current Date :
        <span id="todayDate"></span>
    </p>

    <div class="card">
        <h3>Total Students</h3>
        <p id="totalStudents">0</p>
    </div>

    <div class="card">
        <h3>Total Attendance Records</h3>
        <p id="totalAttendance">0</p>
    </div>

    <br>

    <button onclick="location.href='students.html'">
        Students
    </button>

    <button onclick="location.href='attendance.html'">
        Attendance
    </button>

    <button onclick="location.href='reports.html'">
        Reports
    </button>

</div>

<div class="footer">

    Developed By

    <br><br>

    B. Nandini |
    S. Nithya |
    T. Yasaswi |
    T. Manvitha

</div>

<script>

document.getElementById("todayDate").innerHTML =
new Date().toLocaleDateString();

fetch('/students')
.then(res => res.json())
.then(data => {
    document.getElementById('totalStudents').innerText =
    data.length;
});

fetch('/attendance')
.then(res => res.json())
.then(data => {
    document.getElementById('totalAttendance').innerText =
    data.length;
});

</script>

</body>
</html>

</html>
