<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="css/style.css">
<div class="header">

<img src="logo.png" class="logo">

<h1>MGIT COLLEGE</h1>

<h3>
Real-Time Attendance Tracking and Parent Notification System
</h3>

</div>


<title>Faculty Login</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="login-box">

<h2 align="center">
Faculty Login
</h2>

Username
<br>

<input type="text"
id="username"
style="width:95%;">

<br><br>

Password
<br>

<input type="password"
id="password"
style="width:95%;">

<br><br>

<button
onclick="login()"
style="width:100%;">

Login

</button>

</div>

<script>

async function login(){

const username =
document.getElementById(
'username'
).value;

const password =
document.getElementById(
'password'
).value;

const response =
await fetch('/login',{

method:'POST',

headers:{
'Content-Type':
'application/json'
},

body:JSON.stringify({
username,
password
})

});

const result =
await response.text();

if(result==="success"){

window.location.href =
'dashboard.html';

}
else{

alert(
'Invalid Login'
);

}

}

</script>

</body>
</html>
